# Build check for every pull request and push to main: compiles the debug app and runs unit tests.
# Needs no secrets (Firebase is skipped without google-services.json; Supabase values are blank).
name: Android build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: referral-app/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Turn compiler/Gradle errors into annotations so they show on the PR (and via the API) without opening logs.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |^\* What went wrong|^> |error:|FAILED" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
            echo "::error title=Build::${line//$'\n'/ }"
          done

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: referral-app/android/app/build/reports/tests/
