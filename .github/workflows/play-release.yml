# Builds a signed release bundle and uploads it to Google Play.
#
# Triggers:
#   - push a tag like v1.0.1      -> closed testing track ("alpha"), rolled out to testers
#   - Actions tab -> Run workflow -> pick the track and status (e.g. production, draft)
#
# versionCode = run number + 10 (always increases; the first manual upload used 1).
# versionName = the tag without "v", or the value you type when running it by hand.
#
# Secrets (Settings -> Secrets and variables -> Actions), see RELEASE.md "Automated releases":
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_WEB_CLIENT_ID
#   GOOGLE_SERVICES_JSON_BASE64
#   PLAY_SERVICE_ACCOUNT_JSON
name: Play release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      status:
        description: "completed = roll out now; draft = upload and wait for you in Play Console"
        type: choice
        options: [completed, draft]
        default: completed
      version_name:
        description: "Version name shown to users (e.g. 1.0.1)"
        required: true
        default: "1.0.0"

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: play            # optional: add required reviewers to this environment for a manual approval step
    defaults:
      run:
        working-directory: referral-app/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ inputs.version_name }}"
          fi
          CODE=$(( ${{ github.run_number }} + 10 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Write signing key and config
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD \
                   SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (see RELEASE.md, Automated releases)"; exit 1; fi
          done
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build signed bundle
        run: >
          ./gradlew --no-daemon bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Keep the bundle and R8 mapping
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            referral-app/android/app/build/outputs/bundle/release/app-release.aab
            referral-app/android/app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oamsapps.warmintro
          releaseFiles: referral-app/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: referral-app/android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ github.event_name == 'push' && 'alpha' || inputs.track }}
          status: ${{ github.event_name == 'push' && 'completed' || inputs.status }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      - name: Clean up secrets
        if: always()
        run: rm -f keystore.properties local.properties app/google-services.json "$RUNNER_TEMP/upload.jks"
